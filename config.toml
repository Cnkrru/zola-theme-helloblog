# ==============================================================================
# Helloblog Zola 主题示例配置（示例站点全量配置）
#
# 主题默认值在 theme.toml 的 [extra] 中，Zola 会把两者按 key 合并（表逐 key 合并，
# 数组整体替换），站点里只写要覆盖的项即可。本文件是示例站点的全量配置，可作为
# 所有可选项的参考。
#
# 注意：[translations] 与 [languages] 不会从主题合并，安装主题时必须把这两段
# 复制到站点 config.toml，否则 trans() 会报错。
# ==============================================================================

base_url = "https://example.org/"
title = "Helloblog"
description = "Helloblog 示例站点，演示主题的全部配置项。"
default_language = "zh"
compile_sass = false
minify_html = false
generate_feeds = true
build_search_index = false

taxonomies = [{ name = "tags" }]

# 语法高亮：giallo 单主题 + 行内颜色，避免额外的主题 CSS 依赖
[markdown.highlighting]
theme = "github-dark"
style = "inline"

# ---------- 站点参数 ----------
[extra]
keywords = ["Zola", "blog", "helloblog"]
images = ["og-cover.png"]
color_theme = "sakura"   # sakura / purple / ink / cyan / blue
glass_opacity = 0.5      # 玻璃拟态透明度 0~1
siteage = "2026-10-04"   # 建站日期 YYYY-MM-DD，留空则不显示运行天数
avatar = "avator.webp"   # 侧栏头像，相对 static 目录
saying = ""              # 侧栏一句话，留空用翻译文案
copyright = "2026 Helloblog, power by Zola, All rights reserved"

[extra.index]
logo = "Helloblog"
welcome = ["Hello, world", "欢迎来到示例站点"]
increase_speed = 60
decrease_speed = 40
loop_speed = 1000
particle_enable = true
particle_distance = 180

[extra.background]
enable = true
image = "background.webp"
overlay_dark = 0.6
overlay_light = 0.5

[extra.giscus]
enable = false
repo = "owner/repo"
repo_id = ""
category = "General"
category_id = ""
mapping = "pathname"
strict = "0"
reactions_enabled = "1"
emit_metadata = "0"
input_position = "bottom"

# 导航：key 命中 [translations] 中的同名键，name 作为回退文案
[[extra.menu]]
key = "nav.posts"
name = "文章"
path = "posts/"
icon = "posts"
[[extra.menu]]
key = "nav.about"
name = "关于"
path = "about/"
icon = "about"
[[extra.menu]]
key = "nav.category"
name = "归档"
path = "category/"
icon = "category"
[[extra.menu]]
key = "nav.tags"
name = "标签"
path = "tags/"
icon = "tags"
[[extra.menu]]
key = "nav.link"
name = "友链"
path = "link/"
icon = "link"

# 语言显示名，用于语言切换器
[extra.language_names]
zh = "中文"
en = "English"

# ---------- 多语言 ----------
[languages.zh]

[languages.en]
title = "Helloblog"
description = "Helloblog example site, demonstrating every theme option."
generate_feeds = true
taxonomies = [{ name = "tags" }]

