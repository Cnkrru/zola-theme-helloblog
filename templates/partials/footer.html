<footer class="footer">
  {% if config.extra.siteage %}
  <div class="siteage" data-start="{{ config.extra.siteage }}" data-format="{{ trans(key='footer.runtime') }}">
    <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10" />
      <polyline points="12 6 12 12 16 14" />
    </svg>
    <span></span>
  </div>
  {% endif %}
  <div class="copyright">&copy; {{ config.extra.copyright | default(value=config.title) }}</div>
</footer>
