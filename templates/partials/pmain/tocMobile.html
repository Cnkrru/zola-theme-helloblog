{% if page.toc | length > 0 %}
<button class="toc-fab" type="button" title="{{ trans(key='toc.open') }}" aria-label="{{ trans(key='toc.open') }}">
  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="8" y1="6" x2="21" y2="6" />
    <line x1="8" y1="12" x2="21" y2="12" />
    <line x1="8" y1="18" x2="21" y2="18" />
    <line x1="3" y1="6" x2="3.01" y2="6" />
    <line x1="3" y1="12" x2="3.01" y2="12" />
    <line x1="3" y1="18" x2="3.01" y2="18" />
  </svg>
</button>

<dialog class="toc-dialog" aria-label="{{ trans(key='toc.heading') }}">
  <div class="dialog-head">
    <span>{{ trans(key='toc.title') }}</span>
    <button class="dialog-close" type="button" title="{{ trans(key='toc.close') }}" aria-label="{{ trans(key='toc.close') }}">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    </button>
  </div>
  <div class="toc-dialog-list">
    {% include "partials/pmain/tocItems.html" %}
  </div>
</dialog>
{% endif %}
